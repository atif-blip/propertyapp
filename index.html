<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5a37">
<title>محضر استلام وتسليم العقار</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#14202b;--m:#5d6b78;--p:#1f5a37;--g:#16a34a;--o:#d97706;--r:#dc2626;--b:#d9e0e6}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--c:#18212a;--t:#e8eef3;--m:#93a1ad;--b:#2a3642}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:14px 16px;font-size:18px;font-weight:700;position:sticky;top:0;z-index:5}
nav{display:flex;background:var(--c);border-bottom:1px solid var(--b)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--m);font:inherit;font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p);font-weight:700}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button{padding:12px 4px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
.types button.on{background:var(--p);color:#fff;border-color:var(--p)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-weight:700;margin-top:12px}
.btn.s{background:var(--bg);color:var(--t);border:1px solid var(--b)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.st button{padding:9px 2px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;font-size:13px}
.st button.on.g{background:var(--g);color:#fff}.st button.on.o{background:var(--o);color:#fff}.st button.on.r{background:var(--r);color:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}
.g{background:var(--g)}.o{background:var(--o)}.r{background:var(--r)}.n{background:var(--m)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
small{color:var(--m)}.hide{display:none}.brand{background:#fff;text-align:center;padding:14px 10px 10px;border-bottom:4px solid #c9a24d}.brand img{height:104px;max-width:70%;object-fit:contain}button:active,.btn:active{opacity:.6;transform:scale(.97)}a.btn{text-align:center;text-decoration:none}#ts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:9;max-width:90%;text-align:center}.row .btn{width:auto;flex:1 1 30%}
</style>
</head>
<body>
<div class="brand"><img id="lg" alt="شعار أحمد المحيسني العقارية"></div>
<header id="hd">استلام العقار</header>
<nav id="nav"><button data-v="newr" class="on">استلام عقار</button><button data-v="newh">تسليم عقار</button><button data-v="list">السجلات</button><button data-v="set">الإعدادات</button></nav>
<main id="app"></main>

function norm(n){

  return base()+"#c="+enc(payload(r));
}
function fbU(path,q){return "https://firestore.googleapis.com/v1/projects/"+cfg.fb.p+"/databases/(default)/documents/"+path+"?"+(q?q+"&":"")+"key="+cfg.fb.k}
function fid(){var a=new Uint8Array(12);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return (x%36).toString(36)}).join("")}
function fbCreate(r){
  var id=fid();
  return fetch(fbU("handovers","documentId="+id),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{d:{stringValue:JSON.stringify(payload(r))},st:{stringValue:"p"},rs:{stringValue:""},at:{stringValue:""}}})}).then(function(x){if(!x.ok)throw 0;r.fid=id});
}
function fbSync(manual){
  if(!fbOn())return Promise.resolve();
  var ps=recs.filter(function(r){return r.fid&&!r.dec}).map(function(r){
    return fetch(fbU("handovers/"+r.fid)).then(function(x){return x.ok?x.json():null}).then(function(j){
      if(!j||!j.fields)return 0;var f=j.fields,st=f.st&&f.st.stringValue;
      if(st&&st!="p"){var o={};try{o=JSON.parse(f.rs.stringValue)}catch(e){}
        r.dec=st;r.at=f.at.stringValue;r.cr=o.r||{};r.cn=o.n||"";return 1}
      return 0;
    }).catch(function(){return 0});
  });
  return Promise.all(ps).then(function(a){
    if(a.some(Boolean)){sv("recs",recs);var b=document.querySelector("nav button.on");if(b&&b.dataset.v=="list")viewList();toast("وصل رد جديد من العميل")}
    else if(manual)toast("لا توجد ردود جديدة");
  });
}
function fbClient(id,pid,key){
  $("#nav").classList.add("hide");$("#hd").textContent="جاري التحميل...";
  var u="https://firestore.googleapis.com/v1/projects/"+pid+"/databases/(default)/documents/handovers/"+id;
  fetch(u+"?key="+key).then(function(x){if(!x.ok)throw 0;return x.json()}).then(function(j){
    var f=j.fields,pp=expand(JSON.parse(f.d.stringValue));pp.fb={u:u,key:key};
    if(f.st.stringValue!="p"){$("#hd").textContent="محضر مكتمل";app.innerHTML='<div class="card"><b>تم تسجيل ردّك مسبقًا</b><br><small>'+(f.st.stringValue=="a"?"الموافقة على جميع البنود":"وجود بنود مرفوضة")+'</small></div>'}
    else clientView(pp);
  }).catch(function(){$("#hd").textContent="تعذر فتح الرابط";app.innerHTML='<div class="card">تعذر تحميل المحضر. تأكد من اتصالك بالإنترنت أو اطلب رابطًا جديدًا.</div>'});
}
function send(r){
  if(!base()){toast("لإرسال رابط يعمل للعميل: ارفع التطبيق على استضافة ثم ضع عنوانه في الإعدادات (عنوان التطبيق).");return}
  var m="السلام عليكم "+r.name+"،\nالرجاء مراجعة حالة "+r.type+" رقم "+r.unit+" والموافقة أو الرفض عبر الرابط:\n"+link(r);
  location.href="https://wa.me/"+norm(r.phone)+"?text="+encodeURIComponent(m);
}
function viewList(){
  if(!recs.length){app.innerHTML='<div class="card"><small>لا توجد سجلات بعد.</small></div>';return}
  app.innerHTML=(fbOn()?'<button class="btn s" data-sync="1" style="margin:0 0 12px">تحديث حالة العملاء</button>':'')+(recs.some(function(r){return r.dec=="a"})?'<button class="btn s" data-dla="1" style="margin:0 0 12px">تحميل كل الموافقات في ملف واحد</button>':'')+recs.slice().reverse().map(function(r){
    var bad=r.items.filter(function(x){return x.s>0}).length;
    var dd=r.dec?'<span class="tag '+DEC[r.dec][1]+'">'+DEC[r.dec][0]+'</span>':'<span class="tag n">بانتظار رد العميل</span>';
    return'<div class="card"><div class="row"><b>'+(r.mode=="h"?"تسليم":"استلام")+' · '+esc(r.type)+' '+esc(r.unit)+'</b>'+dd+'</div><small>'+esc(r.name)+' · '+esc(r.phone)+' · '+esc(r.date)+'<br>بنود تحتاج إصلاح/سيئة: '+bad+(r.at?'<br>تاريخ ووقت القرار: '+ft(r.at):'')+(r.cr&&Object.keys(r.cr).length?'<br><b>أسباب الرفض:</b> '+Object.keys(r.cr).map(function(k){return esc(r.items[k]?r.items[k].n:'')+': '+esc(r.cr[k])}).join(' ؛ '):'')+(r.cn?'<br>ملاحظات العميل: '+esc(r.cn):'')+'</small>'
    +'<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap"><button class="btn s" style="margin:0" data-snd="'+r.id+'">واتساب</button><button class="btn s" style="margin:0" data-sms="'+r.id+'">SMS</button><button class="btn s" style="margin:0" data-cp="'+r.id+'">نسخ الرابط</button><button class="btn s" style="margin:0" data-em="'+r.id+'">إيميل</button><button class="btn s" style="margin:0" data-ok="'+r.id+'">تسجيل موافقة</button><button class="btn s" style="margin:0" data-no="'+r.id+'">تسجيل رفض</button><button class="btn s" style="margin:0" data-del="'+r.id+'">حذف</button>'+'<button class="btn" style="margin:0" data-dl="'+r.id+'">تحميل</button>'+'</div></div>';
  }).join("");
}
function viewSet(){
  app.innerHTML='<div class="card"><label>عنوان التطبيق بعد رفعه على الاستضافة (مطلوب لعمل الرابط)</label><input id="au" type="url" dir="ltr" placeholder="https://your-site.netlify.app/" value="'+esc(cfg.url)+'"><label>رقم جوال الوسيط (يصله رد العميل)</label><input id="bp" type="tel" placeholder="9665xxxxxxxx" value="'+esc(cfg.phone)+'"></div>'
  +'<div class="card"><b>أنواع العقار</b><small> (سطر لكل نوع)</small><textarea id="tt" rows="6">'+esc(cfg.types.join("\n"))+'</textarea></div>'
  +'<div class="card"><b>بنود الفحص</b><small> (سطر لكل بند، يمكنك إضافة بنود جديدة)</small><textarea id="ii" rows="8">'+esc(cfg.items.join("\n"))+'</textarea></div>'
  +'<div class="card"><b>ربط Firebase (لتحديث حالة العميل تلقائيًا)</b><label>Project ID</label><input id="fp" dir="ltr" value="'+esc((cfg.fb||{}).p||"")+'"><label>Web API Key</label><input id="fk" dir="ltr" value="'+esc((cfg.fb||{}).k||"")+'"></div>'
  +'<div class="card"><b>الأجهزة والملحقات بعدد</b><small> (سطر لكل بند)</small><textarea id="cc" rows="5">'+esc(cfg.cnt.join("\n"))+'</textarea></div><div class="card"><label>اسم الشركة (للتوقيع في الملف)</label><input id="co" value="'+esc(cfg.co)+'"></div><button class="btn" id="ss">حفظ الإعدادات</button><p style="text-align:center;color:var(--m);font-size:12px;margin-top:14px">الإصدار: 2026-11-10 (يتضمن خيار «أخرى»)</p>';
}
function show(v){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v==v)});
  $("#hd").textContent="محضر استلام وتسليم العقار";if(v=="newr"||v=="newh"){if(!cur)cur=fresh();cur.mode=v=="newh"?"h":"r"}({newr:viewNew,newh:viewNew,list:viewList,set:viewSet})[v]();window.scrollTo(0,0);if(v=="list")fbSync();
}
$("#nav").onclick=function(e){var b=e.target.closest("button");if(b){sync();show(b.dataset.v)}};
app.onclick=function(e){
  var b=e.target.closest("button");if(!b)return;var D=b.dataset;
  if(D.t){sync();if(D.t=="__other"){if(!cur.oth){cur.oth=true;cur.type=""}}else{cur.oth=false;cur.type=D.t}viewNew()}
  else if(D.s!==undefined){sync();cur.items[D.i].s=+D.s;viewNew();}
  else if(b.id=="save"){sync();
    if(!(cur.rep||"").trim()){toast("اسم ممثل الشركة إلزامي");var re=$("#rp");if(re){re.focus();re.scrollIntoView({block:"center"})}return}
    if(!cur.type||!cur.unit||!cur.name||!cur.phone){toast("أكمل نوع العقار ورقم الوحدة واسم العميل ورقم الجوال");return}
    
    var r=cur;recs.push(r);sv("recs",recs);cur=null;show("list");share(r)}
  else if(D.snd||D.sms||D.cp||D.em){var K=D.snd||D.sms||D.cp||D.em;share(recs.filter(function(r){return r.id==K})[0])}
  else if(D.sync){fbSync(true)}
  else if(D.addm){sync();cur.mt.push({});viewNew()}
  else if(D.dl){var r=recs.filter(function(x){return x.id==D.dl})[0];dl("تفاصيل-"+r.unit+".html",report([r]))}
  else if(D.dla){var A=recs.filter(function(r){return r.dec=="a"});dl("الموافقات-"+today()+".html",report(A))}
  else if(D.m){sync();cur.mode=D.m;viewNew()}
  else if(D.copy){var t=document.getElementById("lk");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"تم نسخ الرابط":"حدد النص وانسخه يدويًا")}
  else if(D.ok||D.no){recs.forEach(function(r){if(r.id==(D.ok||D.no)){r.dec=D.ok?"a":"d";r.at=new Date().toISOString()}});sv("recs",recs);viewList()}
  else if(D.del){if(b.dataset.arm){recs=recs.filter(function(r){return r.id!=D.del});sv("recs",recs);viewList()}else{b.dataset.arm=1;b.textContent="اضغط للتأكيد"}}
  else if(b.id=="ss"){
    var L=function(id){return $(id).value.split("\n").map(function(s){return s.trim()}).filter(Boolean)};
    cfg={v:3,fb:{p:$("#fp").value.trim(),k:$("#fk").value.trim()},last:cfg.last||DEF.last,cnt:L("#cc"),co:$("#co").value.trim()||DEF.co,types:L("#tt"),items:L("#ii"),phone:$("#bp").value.trim(),url:$("#au").value.trim()};sv("cfg",cfg);cur=null;toast("تم الحفظ");show("newr")}
};
var m=location.hash.match(/^#c=(.+)$/),fm=location.hash.match(/^#f=([^.]+)\.([^.]+)\.(.+)$/);
if(fm){fbClient(fm[1],fm[2],fm[3])}
else if(m){try{clientView(expand(dec(m[1])))}catch(e){app.innerHTML='<div class="card">الرابط غير صالح</div>'}}
else{show("newr");setInterval(function(){if(!document.hidden)fbSync()},20000)}
</script>
</body>
</html>
